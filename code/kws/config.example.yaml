
# KWS configuration example

# Device
device: auto  # auto / cpu / cuda


# Paths
output_dir: "path/to/output/directory"
clean_dir: "path/to/google_speech_commands"
meta: "path/to/noisy_metadata.csv"
noisy_dir: "path/to/noisy_dataset"
enh_baseline: "path/to/baseline_enhanced_dataset"
enh_trained: "path/to/trained_enhanced_dataset"


# Dataset
folder_start: 0
folder_end: 30

# Set to null to use folder_start/folder_end.
# Alternatively, specify a subset, e.g.:
# selected_folders: ["bed", "bird", "dog"]
selected_folders: null

sampling_rate: 16000
n_mfcc: 13


# DataLoader
batch_size: 64
num_workers: 0
shuffle_train: true
use_parallel: true

# Training
epochs: 150
patience: 10
lr: 0.001
weight_decay: 0.0001

random_state: 42