# ---- historical config follows (paths substituted) ----
# KWS: 30-class experiment, EVALUATE A SAVED MODEL (no training)
#
# Reconstructs run: outputs/new_runs/2026-05-29_19-14-17_all_annot_false
#   This run has no models/ directory (evaluation only). Its clean / noisy /
#   enh_baseline / enh_trained accuracies (0.9303 / 0.6484 / 0.789 / 0.8248)
#   equal those of training run 2026-05-26_18-01-43_all_folders. That shows it
#   evaluated the saved 30-class model in outputs/dscnn_full_dataset_best/.
#   Unlike the training run, it also reports enh_baseline enhancement metrics.
# Usage LIMITATION: run_evaluation_main.py has no --config option. It always
#   reads code/kws/new_config.yaml (hard-coded at the bottom of the script).
#   Until a --config option is added (a code change, not part of this
#   documentation pass), using this file means placing its contents in
#   code/kws/new_config.yaml. Back up any existing local new_config.yaml first.
#
# Provenance legend: see kws_30class_train.yaml. [COMMIT] means the value appears
# in the committed new_config.yaml from 92da893 (2026-06-01) onward.
# "annot_false" in the run name refers to confusion-matrix plot annotations.
# That is not a config key.

